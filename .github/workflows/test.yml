name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Locally on Windows this project uses `py test_all.py`.
      # In GitHub Actions we run `python test_all.py`; this small shim lets
      # the existing test_all.py continue to launch child tests through `py`.
      - name: Add py compatibility command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\npython "$@"\n' > "$RUNNER_TEMP/bin/py"
          chmod +x "$RUNNER_TEMP/bin/py"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: python test_all.py
